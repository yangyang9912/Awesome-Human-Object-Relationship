name: Update Papers (paper-tracker)
on:
  schedule:
    - cron: "0 8 * * *"        # 每天 UTC 08:00 自动运行（按需调整时区/频率）
  workflow_dispatch: {}        # 允许在 Actions 页面手动触发
permissions:
  contents: write             # 需要推送分支 + 修改 README
  pull-requests: write        # 需要开 Pull Request
jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install --quiet requests pyyaml
      - name: Fetch papers and open PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python paper_tracker.py
