name: Update Papers (paper-tracker)
on:
  schedule:
    - cron: "0 8 * * *"        # 每天 UTC 08:00 自动运行（按需调整时区/频率）
  workflow_dispatch: {}        # 允许在 Actions 页面手动触发
permissions:
  contents: write             # 需要推送分支 + 修改 README
  pull-requests: write        # 需要开 Pull Request
jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install --quiet requests pyyaml

      # 只让脚本检索 + 改写本地 README；不自行提交/开 PR（PAPER_TRACKER_NO_COMMIT=1）
      - name: Fetch papers and update README
        env:
          PAPER_TRACKER_NO_COMMIT: "1"
        run: python paper_tracker.py

      # 由 GitHub 官方 CLI (gh) 负责 commit + 推送分支 + 开 PR（鉴权最稳）
      - name: Open Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # README 无变化就直接结束
          if git diff --quiet README.md; then
            echo "README 无变化，结束。"
            exit 0
          fi

          # 清理上次可能残留的自动分支（忽略不存在的情况）
          git push origin --delete paper-tracker/auto >/dev/null 2>&1 || true

          BRANCH="paper-tracker/$(date +%Y%m%d-%H%M%S)"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git checkout -b "$BRANCH"
          git add README.md
          git commit -m "paper-tracker: 自动新增论文"
          git push -u origin "$BRANCH"

          gh pr create \
            --title "[paper-tracker] 自动新增论文" \
            --body "自动检索并新增论文到 README 对应分类。请审阅 diff，确认无误后点击 Merge。脚本不会直接改 main 分支。" \
            --base main \
            --head "$BRANCH"
